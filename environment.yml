name: goodanalysis
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy
  - scipy
  - scikit-learn
  - matplotlib
  - jupyter
  # only needed to rebuild notebooks from build_notebooks.py:
  - nbformat
  - nbclient
  # only needed for nb4_walkthrough (Rastermap sorting + the clickable figure):
  - pip
  - pip:
      - rastermap
      - ipympl
